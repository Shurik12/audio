services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      cache_from:
        - python:3.10-slim
    container_name: burnout-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DEBUG=true
      - HOST=0.0.0.0
      - PORT=8000
      - SAMPLE_RATE=16000
      - MAX_AUDIO_SIZE_MB=50
      - MAX_AUDIO_DURATION_SEC=300
      - ML_MODELS_PATH=ml_models
      - ALLOWED_ORIGINS=["https://razuma.tech","http://razuma.tech","*"]
    volumes:
      - ./backend/ml_models:/app/ml_models:ro
      - ./backend/uploads:/app/uploads
      - ./backend/temp:/app/temp
    networks:
      - burnout-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: burnout-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - burnout-network

  nginx:
    image: nginx:alpine
    container_name: burnout-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - frontend
    networks:
      - burnout-network

networks:
  burnout-network:
    driver: bridge